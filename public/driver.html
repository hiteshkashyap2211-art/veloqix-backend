<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Veloqix Driver Terminal - Real GPS Telemetry</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="/socket.io/socket.io.js"></script>
  <!-- Favicon / Logo for Google Search Results -->
    <link rel="icon" type="image/png" sizes="32x32" href="/logo.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/logo.png">
    <link rel="shortcut icon" href="/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/logo.png">
    <link rel="icon" type="image/svg+xml" href="/logo.svg">

    <!-- Organization Schema Markup for Google Knowledge / AI Overview -->
    <script type="application/ld+json">
        
        {
        "@context": "https://schema.org",
        "@graph": [
            {
            "@type": "Organization",
            "@id": "https://veloqix-technologies.onrender.com/#organization",
            "name": "Veloqix Technologies",
            "url": "https://veloqix-technologies.onrender.com/",
            "logo": {
                "@type": "ImageObject",
                "url": "https://veloqix-technologies.onrender.com/logo.svg"
            },
            "founder": {
                "@type": "Person",
                "name": "Hitesh Kashyap",
                "sameAs": [
                "https://www.linkedin.com/in/hitesh-kashyap-682150402/"
                ]
            }
            },
            {
            "@type": "WebSite",
            "@id": "https://veloqix-technologies.onrender.com/#website",
            "url": "https://veloqix-technologies.onrender.com/",
            "name": "Veloqix Technologies",
            "publisher": {
                "@id": "https://veloqix-technologies.onrender.com/#organization"
            }
            }
        ]
        }
    </script>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #070c1e; color: #f1f5f9; }
    .mono { font-family: 'JetBrains Mono', monospace; }
    .glass-card { 
      background: rgba(15, 23, 42, 0.85); 
      backdrop-filter: blur(16px); 
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08); 
      box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 max-w-md mx-auto">

  <header class="flex justify-between items-center py-2.5 border-b border-slate-800/80 mb-4">
    <div class="flex items-center gap-3">
      <div class="bg-gradient-to-tr from-blue-600 to-indigo-500 p-2.5 rounded-xl text-white font-bold text-sm shadow-lg">⚡</div>
      <div>
        <h1 class="text-base font-bold text-white flex items-center gap-1.5">
          VELOQIX DRIVER PRO
          <span class="text-[9px] px-1.5 py-0.5 rounded bg-blue-500/20 text-blue-300 border border-blue-500/30">v2.0</span>
        </h1>
        <p class="text-[10px] text-slate-400">Mobile Telemetry Terminal</p>
      </div>
    </div>
    <span id="socketBadge" class="text-[10px] px-2.5 py-1 rounded-full bg-amber-500/10 text-amber-400 border border-amber-500/20 font-medium flex items-center gap-1.5">
      <span class="w-2 h-2 rounded-full bg-amber-400 animate-ping"></span> Connecting
    </span>
  </header>

  <main class="space-y-4 flex-1">
    <div class="glass-card p-4 rounded-2xl space-y-3">
      <h2 class="text-xs font-bold text-blue-400 uppercase tracking-wider flex items-center gap-1.5">
        <span>🚛</span> Vehicle Link & Mode
      </h2>
      <div class="grid grid-cols-2 gap-2.5">
        <div>
          <label for="vehId" class="text-[10px] text-slate-400 block mb-1">Vehicle ID</label>
          <input type="text" id="vehId" value="1" class="w-full bg-slate-900 border border-slate-700/80 rounded-xl px-3 py-2 text-xs mono text-slate-100 focus:outline-none focus:border-blue-500">
        </div>
        <div>
          <label for="streamMode" class="text-[10px] text-slate-400 block mb-1">Stream Mode</label>
          <select id="streamMode" class="w-full bg-slate-900 border border-slate-700/80 rounded-xl px-2 py-2 text-xs text-slate-100">
            <option value="websocket">WebSocket Live (Fast)</option>
            <option value="http">HTTP REST API</option>
          </select>
        </div>
      </div>
    </div>

    <div class="glass-card p-5 rounded-2xl space-y-4 text-center">
      <div class="inline-flex items-center justify-center p-3 rounded-2xl bg-blue-500/10 text-blue-400 mb-1 border border-blue-500/20">
        <span class="text-2xl animate-pulse">📡</span>
      </div>
      <div>
        <span class="text-[10px] text-slate-400 uppercase tracking-widest block font-semibold">Current Speed</span>
        <div class="text-4xl font-extrabold text-white mono mt-1" id="speedDisplay">0 <span class="text-sm font-normal text-slate-400">km/h</span></div>
      </div>
      <div class="grid grid-cols-2 gap-3 pt-3 border-t border-slate-800">
        <div class="bg-slate-900/80 p-2.5 rounded-xl border border-slate-800">
          <span class="text-[10px] text-slate-500 block">Latitude</span>
          <span class="text-xs font-bold mono text-blue-400" id="latDisplay">--.----</span>
        </div>
        <div class="bg-slate-900/80 p-2.5 rounded-xl border border-slate-800">
          <span class="text-[10px] text-slate-500 block">Longitude</span>
          <span class="text-xs font-bold mono text-blue-400" id="lngDisplay">--.----</span>
        </div>
      </div>
      <div class="text-[11px] text-slate-400 font-medium bg-slate-950/40 py-1.5 px-3 rounded-lg inline-block border border-slate-800" id="gpsAccuracy">
        GPS Status: Ready
      </div>
    </div>

    <div class="space-y-2.5">
      <button id="toggleBtn" onclick="toggleTracking()" class="w-full py-3.5 px-4 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-2xl text-sm transition-all shadow-lg shadow-emerald-600/20 active:scale-[0.98] flex items-center justify-center gap-2">
        <span>▶️ Start Live GPS Hardware Stream</span>
      </button>
      <button onclick="sendSinglePulse()" class="w-full py-2.5 px-4 bg-slate-800 hover:bg-slate-700 text-slate-200 font-medium rounded-xl text-xs transition border border-slate-700 active:scale-[0.98] flex items-center justify-center gap-2">
        <span>📡 Force Instant GPS Pulse</span>
      </button>
    </div>

    <div class="glass-card p-3.5 rounded-2xl">
      <div class="flex items-center justify-between mb-1.5">
        <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block">Terminal Activity Log</span>
        <span class="text-[9px] text-slate-500 mono">Auto-scroll</span>
      </div>
      <pre id="log" class="text-[10px] mono text-slate-300 bg-slate-950/90 p-2.5 rounded-xl h-28 overflow-y-auto whitespace-pre-wrap border border-slate-800 leading-relaxed">System Initialized...</pre>
    </div>
  </main>

  <script>
    let watchId = null;
    let isTracking = false;
    
    // Auto-connect to current server origin
    const socket = io();

    socket.on('connect', () => {
      const badge = document.getElementById('socketBadge');
      badge.className = "text-[10px] px-2.5 py-1 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 font-medium flex items-center gap-1.5";
      badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span> Live`;
      addLog("Connected to Veloqix Command Center Socket.");
    });

    socket.on('disconnect', () => {
      const badge = document.getElementById('socketBadge');
      badge.className = "text-[10px] px-2.5 py-1 rounded-full bg-rose-500/10 text-rose-400 border border-rose-500/20 font-medium flex items-center gap-1.5";
      badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-rose-400"></span> Disconnected`;
      addLog("Socket connection closed.");
    });

    function addLog(msg) {
      const log = document.getElementById('log');
      const time = new Date().toLocaleTimeString();
      log.innerText = `[${time}] ${msg}\n` + log.innerText;
    }

    function toggleTracking() {
      if (isTracking) {
        stopTracking();
      } else {
        startTracking();
      }
    }

    function startTracking() {
      if (!("geolocation" in navigator)) {
        alert("Geolocation API is not supported on this device/browser.");
        return;
      }

      const btn = document.getElementById('toggleBtn');
      btn.className = "w-full py-3.5 px-4 bg-rose-600 hover:bg-rose-500 text-white font-bold rounded-2xl text-sm transition-all shadow-lg shadow-rose-600/20 animate-pulse flex items-center justify-center gap-2";
      btn.innerHTML = `<span>⏹ Stop Tracking</span>`;

      isTracking = true;
      addLog("Acquiring Live Hardware GPS Fix...");

      watchId = navigator.geolocation.watchPosition(
        (position) => {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;
          const speed = position.coords.speed && position.coords.speed > 0 
            ? Math.round(position.coords.speed * 3.6) 
            : 0;
          const accuracy = Math.round(position.coords.accuracy);

          document.getElementById('latDisplay').innerText = lat.toFixed(5);
          document.getElementById('lngDisplay').innerText = lng.toFixed(5);
          document.getElementById('speedDisplay').innerHTML = `${speed} <span class="text-sm font-normal text-slate-400">km/h</span>`;
          document.getElementById('gpsAccuracy').innerText = `GPS Signal: Strong (±${accuracy}m)`;

          dispatchTelemetry(lat, lng, speed);
        },
        (error) => {
          addLog(`GPS Warning: ${error.message}. Emitting location fallback.`);
          document.getElementById('gpsAccuracy').innerText = `⚠️ GPS Fallback Active`;
          // Delhi NCR bounds fallback
          const fallbackLat = 28.5855 + (Math.random() * 0.002 - 0.001);
          const fallbackLng = 77.1274 + (Math.random() * 0.002 - 0.001);
          dispatchTelemetry(fallbackLat, fallbackLng, 35);
        },
        { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
      );
    }

    function stopTracking() {
      if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
      }

      isTracking = false;
      const btn = document.getElementById('toggleBtn');
      btn.className = "w-full py-3.5 px-4 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-2xl text-sm transition-all shadow-lg shadow-emerald-600/20 flex items-center justify-center gap-2";
      btn.innerHTML = `<span>▶️ Start Live GPS Hardware Stream</span>`;

      addLog("Tracking stopped.");
    }

    function sendSinglePulse() {
      if ("geolocation" in navigator) {
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            const speed = pos.coords.speed ? Math.round(pos.coords.speed * 3.6) : 45;
            dispatchTelemetry(pos.coords.latitude, pos.coords.longitude, speed);
          },
          () => {
            dispatchTelemetry(28.5855, 77.1274, 40);
          },
          { enableHighAccuracy: true, timeout: 5000 }
        );
      }
    }

    async function dispatchTelemetry(latitude, longitude, speed_kmh) {
      const vehicle_id = document.getElementById('vehId').value || '1';
      const mode = document.getElementById('streamMode').value;

      const payload = {
        vehicle_id,
        latitude,
        longitude,
        speed_kmh,
        temperature_celsius: (21 + Math.random() * 2).toFixed(1),
        timestamp: new Date().toISOString()
      };

      socket.emit('telemetry', payload);

      if (mode === 'http') {
        try {
          await fetch('/api/vehicles/telemetry', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
        } catch (e) { console.error(e); }
      }

      addLog(`Streamed: ${latitude.toFixed(4)}, ${longitude.toFixed(4)} | ${speed_kmh} km/h`);
    }
  </script>
</body>
</html>
